 <g class="h" text-anchor="middle"><text x="228" y="159">Y+</text><text x="228" y="301">Y−</text><text x="128" y="231">X−</text><text x="328" y="231">X+</text></g>
 <circle cx="228" cy="220" r="37" fill="#0d2a46" stroke="#00dfff" stroke-width="2"/><text x="228" y="228" text-anchor="middle" class="s">XY</text>
 <rect x="22" y="365" width="416" height="44" rx="10" fill="#064dbd"/><text x="230" y="393" text-anchor="middle" class="btn">HOME ALL     Z+     Z−</text>
</g>
<g transform="translate(520 550)">
 <rect width="460" height="430" rx="18" class="card"/>
