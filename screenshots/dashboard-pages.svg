 <g><rect x="22" y="58" width="205" height="145" rx="12" class="card"/><text x="42" y="88" class="s">PRINT SPEED</text><text x="42" y="132" class="v">100%</text><rect x="42" y="157" width="165" height="10" rx="5" fill="#1d3550"/><rect x="42" y="157" width="132" height="10" rx="5" fill="url(#green)"/>
 <rect x="247" y="58" width="205" height="145" rx="12" class="card"/><text x="267" y="88" class="s">FLOW</text><text x="267" y="132" class="v">100%</text><rect x="267" y="157" width="165" height="10" rx="5" fill="#1d3550"/><rect x="267" y="157" width="132" height="10" rx="5" fill="url(#blue)"/>
 <rect x="472" y="58" width="205" height="145" rx="12" class="card"/><text x="492" y="88" class="s">PRESSURE ADVANCE</text><text x="492" y="132" class="v">0.035</text><text x="492" y="172" class="tiny">TEST / SAVE / RESET</text></g>
 <text x="25" y="245" class="s">MOTION LIMITS</text>
