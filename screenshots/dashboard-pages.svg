<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020914"/><stop offset="1" stop-color="#0b1e35"/></linearGradient>
 <linearGradient id="blue" x2="1"><stop stop-color="#0860ff"/><stop offset="1" stop-color="#00dcff"/></linearGradient>
 <linearGradient id="green" x2="1"><stop stop-color="#00b85a"/><stop offset="1" stop-color="#00f5a0"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .h{font:700 24px sans-serif;fill:#f3f8ff}.s{font:600 14px sans-serif;fill:#9bc9ef}.v{font:800 26px sans-serif;fill:#00dfff}.tiny{font:600 11px sans-serif;fill:#b9d7f4}.btn{font:700 13px sans-serif;fill:#eaf6ff}.card{fill:#0a1a2d;stroke:#087eb9;stroke-width:2}.line{stroke:#00d9ff;stroke-width:2;fill:none}
 </style>
</defs>
<rect width="1500" height="1040" rx="26" fill="url(#bg)"/>
<text x="44" y="54" class="h" font-size="32">VORON  /  KLIPPERSCREEN NEON UI</text>
<text x="1455" y="52" text-anchor="end" class="s">800 × 480 TOUCHSCREEN CONCEPT</text>
<!-- panels -->
<g transform="translate(35 85)">
 <rect width="700" height="430" rx="18" class="card"/>
 <text x="22" y="34" class="h">01  HOME / PRINT DASHBOARD</text>
 <rect x="18" y="52" width="82" height="350" rx="10" fill="#07172a" stroke="#087eb9"/>
 <g class="tiny"><text x="34" y="90">⌂ HOME</text><text x="34" y="142">TUNE</text><text x="34" y="194">CONTROL</text><text x="34" y="246">FILES</text><text x="34" y="298">MESH</text><text x="34" y="350">MORE</text></g>
