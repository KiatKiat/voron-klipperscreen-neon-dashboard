 <g><rect x="22" y="58" width="416" height="82" rx="12" class="card"/><text x="42" y="88" class="s">NOZZLE</text><text x="42" y="122" class="v">250°C</text><text x="395" y="117" text-anchor="end" class="tiny">TARGET 250°C</text>
 <rect x="22" y="152" width="416" height="82" rx="12" class="card"/><text x="42" y="182" class="s">BED</text><text x="42" y="216" class="v">90°C</text><text x="395" y="211" text-anchor="end" class="tiny">TARGET 90°C</text>
 <rect x="22" y="246" width="416" height="82" rx="12" class="card"/><text x="42" y="276" class="s">PART FAN</text><text x="42" y="310" class="v">65%</text><text x="395" y="305" text-anchor="end" class="tiny">HOTEND / AUX</text></g>
 <text x="25" y="375" class="s">LIVE HEATER &amp; FAN CONTROLS</text><path d="M25 395 H430" class="line"/>
</g>
<g transform="translate(1005 550)">
 <rect width="460" height="430" rx="18" class="card"/>
 <text x="22" y="36" class="h">05  FILES / BED MESH / SYSTEM</text>
 <rect x="22" y="58" width="416" height="65" rx="10" class="card"/><text x="42" y="85" class="s">3DBENCHY.GCODE</text><text x="42" y="108" class="tiny">PRINT   •   RENAME   •   DELETE</text>
 <rect x="22" y="136" width="198" height="155" rx="10" class="card"/><text x="40" y="164" class="s">BED MESH</text>
 <g stroke="#00dfff" fill="none" stroke-width="2"><path d="M45 220 L95 192 L145 220 L195 192 M45 245 L95 217 L145 245 L195 217 M45 220 V245 M95 192 V217 M145 220 V245 M195 192 V217"/></g>
 <rect x="235" y="136" width="203" height="155" rx="10" class="card"/><text x="253" y="164" class="s">SYSTEM</text><text x="253" y="202" class="v">42°C</text><text x="253" y="224" class="tiny">MCU TEMPERATURE</text><text x="253" y="258" class="tiny">CPU / RAM / NETWORK</text>
 <rect x="22" y="304" width="416" height="105" rx="10" class="card"/><text x="42" y="335" class="s">SPOOLMAN / FILAMENT</text><text x="42" y="373" class="v">PLA  •  1.2 kg</text><text x="42" y="394" class="tiny">MATERIAL / COLOR / COST / REMAINING</text>
</g>
