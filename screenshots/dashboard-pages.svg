 <path d="M160 205 L200 158 L250 168 L282 130 L318 160 L365 177 L400 212 Z" fill="#087bff" stroke="#00dfff" stroke-width="3" filter="url(#glow)"/>
 <rect x="468" y="52" width="212" height="205" rx="12" class="card"/>
 <circle cx="574" cy="148" r="69" stroke="#233e5e" stroke-width="18" fill="none"/><path d="M574 79 A69 69 0 1 1 509 171" stroke="url(#blue)" stroke-width="18" fill="none" stroke-linecap="round"/>
 <text x="574" y="157" text-anchor="middle" class="h" font-size="34">68%</text><text x="574" y="184" text-anchor="middle" class="s">PRINTING</text>
 <g><rect x="112" y="270" width="178" height="76" rx="10" class="card"/><text x="128" y="295" class="s">NOZZLE</text><text x="128" y="328" class="v">250°C</text>
 <rect x="300" y="270" width="178" height="76" rx="10" class="card"/><text x="316" y="295" class="s">BED</text><text x="316" y="328" class="v">90°C</text>
